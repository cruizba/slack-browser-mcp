name: go

# The port has to work on three systems. A public repository runs the hosted
# runners for free, so the matrix is the cheapest honest answer to "does this
# build on Windows" — and the only way to exercise the code that a build tag or
# a simulated GOOS would leave untested on the runner that does have it.
#
# `go-rewrite` is temporary: it disappears when the branch merges.
on:
  push:
    branches:
      - main
      - go-rewrite
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify the module
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race needs cgo, and the Windows image has no C toolchain Go will pick up
      # on its own, so the detector runs only where it works. Windows runs the
      # same tests without it rather than being skipped.
      # `-count=2` because one pass cannot see what only the second one does: tests
      # that run in parallel in one process and share a package-level value look green
      # the first time and race the second, which is how the forum's build version was
      # caught. One runner pays for it; the other two prove the platforms.
      - name: Test with the race detector
        if: runner.os != 'Windows'
        run: go test -race -shuffle=on -count=2 ./...

      - name: Test
        if: runner.os == 'Windows'
        run: go test -shuffle=on ./...

      # A check on the file, not on the system, so one runner is enough.
      - name: Check go mod tidy
        if: runner.os == 'Linux'
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The integration build tag is included so the differential harness is held
      # to the same bar as the code it judges.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: --timeout 5m --build-tags=integration

      # A configuration the linter cannot read is a linter that silently checks
      # nothing, so the file is validated before it is trusted.
      - name: Check the linter configuration
        run: golangci-lint config verify

      # vet is cheap and it reads build tags, so the two platforms this job cannot run
      # are type-checked here. It is not a substitute for the matrix; it is what
      # catches a `//go:build windows` file that stopped compiling at review time.
      - name: Vet against the other platforms
        run: |
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...

  # Three checks that need no test run, so they go beside the matrix rather than in it.
  vuln:
    name: vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Pinned: a scanner that changes under the build turns a green commit red for
      # reasons that have nothing to do with this code.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Look for known vulnerabilities
        run: govulncheck ./...

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      # The whole history, because a token that was committed and then removed is
      # still in every clone of this repository.
      - name: Check out the history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan every commit
        run: gitleaks detect --source . --no-banner --redact --config .gitleaks.toml

  # Coverage is measured on its own so the floor cannot depend on which platform ran
  # it, and so the table lands in the job summary where the trend is visible.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Measure
        run: go test -coverprofile=coverage.out -covermode=count ./... >/dev/null

      - name: Report and gate
        run: |
          go tool cover -func=coverage.out | tail -1

          {
            echo "### Coverage by package"
            echo
            echo "| package | statements |"
            echo "| --- | --- |"
            go test -cover ./... 2>/dev/null \
              | grep -oE 'slack-browser-mcp/internal/[a-z/]+.*coverage: [0-9.]+%' \
              | sed -E 's#.*slack-browser-mcp/(internal/[a-z/]+).*coverage: ([0-9.]+)%.*#| \1 | \2% |#' \
              | sort
          } >> "$GITHUB_STEP_SUMMARY"

          total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          # Raise this as coverage goes up: it is a ratchet, not a target.
          floor=56

          if awk -v t="$total" -v f="$floor" 'BEGIN { exit !(t >= f) }'; then
            echo "coverage: ${total}% (floor ${floor}%)"
          else
            echo "::error::coverage fell to ${total}%, below the ${floor}% floor"
            exit 1
          fi

  # The tag is irreversible and the release workflow has never run, so the same
  # configuration is exercised on every push: all six targets are cross-compiled and
  # archived here, which is exactly what a tag would publish, minus the upload. This
  # job exists so that `v1.0.0` cannot be the first time .goreleaser.yaml is read.
  goreleaser:
    name: release dry run
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit, with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the six targets without publishing
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v6.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The installers put two files in place, and a copy of the CLI under the forum's
      # name would start the CLI: the archive has to carry the second binary, and only
      # a look inside an archive says so.
      - name: Check every archive carries both entry points
        run: |
          set -eu
          checked=0
          for archive in dist/*.tar.gz dist/*.zip; do
            [ -f "$archive" ] || continue
            case "$archive" in
              *.zip) listing=$(unzip -l "$archive") ;;
              *)     listing=$(tar -tzf "$archive") ;;
            esac
            for name in slack-browser slack-browser-forum; do
              if ! grep -qE "/?$name(\.exe)?$" <<< "$listing"; then
                echo "::error::$archive does not carry $name"
                exit 1
              fi
            done
            checked=$((checked + 1))
          done
          echo "$checked archives carry both entry points"
